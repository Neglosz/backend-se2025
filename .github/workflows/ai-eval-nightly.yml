name: ai eval (nightly)

on:
  schedule:
    # 02:00 Bangkok time. Catches a change in model behaviour before users do.
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run eval:ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        continue-on-error: true
      - run: npm run eval:ocr
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-results
          path: tests/ai-eval/last-*.json
