name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
      # The suite runs entirely offline: Supabase and Gemini are both doubled, so no
      # secrets are needed and nothing reaches an external service.
